name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Gradle permissions
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

# Docker image build/push and KinD-based systems/scenario tests will come back once
# there's something worth packaging and deploying. See ubiquia's .github/workflows/devops.yml
# for the fuller pipeline shape (build -> systems-tests -> scenario-tests -> push-images) to
# reintroduce when ready.
