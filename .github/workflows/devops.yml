name: Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # PRs run the build, system tests and image scan; only pushes publish images.
  pull_request:
    branches:
      - main

env:
  DOCKER_REPO: jeremyacase
  SUBPROJECTS: |
    services/core/java/core-server
    services/core/ts/core-ui
    services/core/rust/core-agent-harness
    services/core/python/core-python-sandbox-server

jobs:

  build:
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.chart.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Gradle permissions
        run: chmod +x ./gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/core/rust/core-agent-harness/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/core/rust/core-agent-harness/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Load OPENJDK_VERSION and CHART_VERSION
        id: chart
        shell: bash
        run: |
          set -euo pipefail
          OPENJDK_VERSION="$(awk -F'= *' '$1=="OPENJDK_VERSION"{print $2; exit}' gradle.properties)"
          CHART_VERSION="$(
            awk -F': *' '$1=="version"{print $2; exit}' deploy/helm/Chart.yaml \
            | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" \
            | xargs
          )"

          echo "Resolved OPENJDK_VERSION=${OPENJDK_VERSION}"
          echo "Resolved CHART_VERSION=${CHART_VERSION}"

          echo "OPENJDK_VERSION=${OPENJDK_VERSION}" >> "$GITHUB_ENV"
          echo "version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build all JARs
        run: ./gradlew clean build

      - name: Build Docker images (tagged as latest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-images
          IFS=$'\n'

          IS_TAG_BUILD=false
          VERSION_TAG=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            IS_TAG_BUILD=true
            VERSION_TAG="${GITHUB_REF_NAME#v}"
          fi

          for dir in $SUBPROJECTS; do
            project_name="$(basename "$dir")"
            IMAGE_NAME="${DOCKER_REPO}/vader-${project_name}"

            echo "----"
            echo "Building $dir  ->  ${IMAGE_NAME}:latest"

            # Angular core UI: pass APP_BASE_PATH for base-href baking, no JDK needed
            if [[ "$dir" == *"/core-ui" ]]; then
              docker build \
                --build-arg APP_BASE_PATH="/" \
                -t "${IMAGE_NAME}:latest" "$dir"
            elif [[ "$dir" == *"/java/"* ]]; then
              docker build \
                --build-arg OPENJDK_VERSION="${OPENJDK_VERSION}" \
                -t "${IMAGE_NAME}:latest" "$dir"
            else
              docker build -t "${IMAGE_NAME}:latest" "$dir"
            fi

            docker save -o "docker-images/${project_name}.tar" "${IMAGE_NAME}:latest"

            if $IS_TAG_BUILD ; then
              echo "Tagging ${IMAGE_NAME}:${VERSION_TAG}"
              docker tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}:${VERSION_TAG}"
              docker save -o "docker-images/${project_name}-${VERSION_TAG}.tar" "${IMAGE_NAME}:${VERSION_TAG}"
            fi
          done

      - name: Upload Docker images as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images

  systems-tests:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # kind v0.24+ enforces NetworkPolicy out of the box, which the sandbox-isolation test needs.
      - name: Set up Kubernetes with KinD
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: vader-agent-0

      - name: Ensure KinD cluster exists
        run: |
          kind get clusters | grep -q "^vader-agent-0$" || kind create cluster --name vader-agent-0

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0

      - name: Create namespace
        run: |
          kubectl create namespace vader || echo "Namespace 'vader' already exists"

      - name: Download Docker image artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: docker-images

      - name: Load Docker images into Docker and KinD (tagged as latest)
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n'
          for dir in $SUBPROJECTS; do
            project_name="$(basename "$dir")"
            IMAGE_NAME="${DOCKER_REPO}/vader-${project_name}"
            echo "Loading docker image from docker-images/${project_name}.tar"
            docker load -i "docker-images/${project_name}.tar"
            kind load docker-image --name vader-agent-0 "$IMAGE_NAME:latest"
          done

      - name: Deploy Helm chart (images tagged as latest)
        run: |
          helm install vader deploy/helm/ --values deploy/helm/configurations/test/test.yaml -n vader --wait --timeout 5m

      - name: Inspect resources before Helm test
        run: |
          echo "Sleeping to allow resources to settle..."
          sleep 30
          echo "=== Pods ==="
          kubectl get pods -n vader -o wide
          echo "=== Services ==="
          kubectl get svc -n vader

      - name: Run systems tests
        run: |
          # The agent-harness and tool-scope tests wait on real Jobs and Pods, and the ZAP scan
          # pulls a large image and crawls for several minutes.
          helm test vader -n vader --timeout 15m

      - name: Inspect resources after Helm test
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n vader -o wide
          echo "=== Services ==="
          kubectl get svc -n vader

      - name: Dump logs from all pods in vader namespace
        if: always()
        run: |
          echo "Getting logs from all pods in namespace 'vader'..."
          for pod in $(kubectl get pods -n vader --no-headers -o custom-columns=":metadata.name"); do
            echo "=============================="
            echo "Logs for pod: $pod"
            echo "=============================="
            kubectl logs -n vader "$pod" || echo "Failed to get logs for $pod"
            echo ""
          done

  # Scans the exact images push-images publishes, so a HIGH/CRITICAL CVE not accepted in
  # .trivyignore.yaml stops the release. Unfixed CVEs are skipped: there is nothing to upgrade to.
  scan-images:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: docker-images

      - name: Scan images
        shell: bash
        env:
          TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          set -uo pipefail
          IFS=$'\n'
          status=0
          for dir in $SUBPROJECTS; do
            project_name="$(basename "$dir")"
            echo "---- Scanning ${project_name}"
            docker run --rm -v "$PWD:/src:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
              image --quiet --disable-telemetry --ignorefile /src/.trivyignore.yaml \
              --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
              --input "/src/docker-images/${project_name}.tar" || status=1
          done
          exit "$status"

  push-images:
    needs: [build, systems-tests, scan-images]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download Docker image artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: docker-images

      - name: Load and push Docker images (tagged as latest + chart version)
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(echo "${{ needs.build.outputs.chart_version }}" \
            | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" \
            | xargs)"

          if [[ -z "${VERSION:-}" ]]; then
            VERSION="$(
              awk -F': *' '$1=="version"{print $2; exit}' deploy/helm/Chart.yaml \
              | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" \
              | xargs
            )"
          fi

          if [[ -z "${VERSION:-}" ]]; then
            echo "ERROR: VERSION is empty. Aborting push to avoid invalid tags."
            exit 1
          fi

          echo "Using chart VERSION=${VERSION}"

          IFS=$'\n'
          for dir in $SUBPROJECTS; do
            project_name="$(basename "$dir")"
            IMAGE_NAME="${DOCKER_REPO}/vader-${project_name}"

            echo "Loading image from docker-images/${project_name}.tar"
            docker load -i "docker-images/${project_name}.tar"

            echo "Tagging and pushing $IMAGE_NAME:$VERSION and $IMAGE_NAME:latest"
            docker tag "$IMAGE_NAME:latest" "docker.io/$IMAGE_NAME:$VERSION"
            docker push "docker.io/$IMAGE_NAME:$VERSION"

            docker tag "$IMAGE_NAME:latest" "docker.io/$IMAGE_NAME:latest"
            docker push "docker.io/$IMAGE_NAME:latest"
          done
