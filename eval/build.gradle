plugins {
    id 'base'
}

// Benchmark cases for EVAL mode: each case's checker, and the tests proving every checker grades
// its own fixtures correctly. Runs dockerized, like core-python-sandbox-server's build.
def pythonImage = 'python:3.12-slim'
def pipCacheVolume = 'vader-eval-pip-cache'

def dockerRunPython = { String shellCommand ->
    [
        'docker', 'run', '--rm',
        '-v', "${projectDir}:/app",
        '-v', "${pipCacheVolume}:/root/.cache/pip",
        '-w', '/app',
        pythonImage,
        'sh', '-c', "pip install --quiet -r requirements-dev.txt && ${shellCommand}"
    ]
}

tasks.register('ruffCheck', Exec) {
    commandLine dockerRunPython('ruff check .')
}

tasks.register('ruffFormatCheck', Exec) {
    commandLine dockerRunPython('ruff format --check .')
}

// One mypy run per checker: every case's checker is a module named check, which a single run
// would reject as duplicates.
tasks.register('mypyCheck', Exec) {
    commandLine dockerRunPython('mypy tests && for checker in cases/*/check.py; do mypy "$checker" || exit 1; done')
}

tasks.register('pytestEval', Exec) {
    dependsOn 'ruffCheck', 'ruffFormatCheck', 'mypyCheck'
    commandLine dockerRunPython('pytest')
}

tasks.named('check').configure {
    dependsOn 'ruffCheck', 'ruffFormatCheck', 'mypyCheck', 'pytestEval'
}
tasks.named('build').configure { dependsOn 'assemble', 'check' }
