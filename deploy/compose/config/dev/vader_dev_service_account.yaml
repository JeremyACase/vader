---

kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: vader
  name: vader-role
rules:
- apiGroups: ["apps", "core", ""]
  resources: ["deployments", "services", "configmaps"]
  verbs: ["get", "create", "delete", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vader-role
subjects:
- kind: ServiceAccount
  name: vader
  namespace: vader

---
