convenience:
  variables:
    spring:
      port: 8080
    tls:
      enabled: &tlsEnabled false

config:
  podLabels:

logging:
  # Allowable values are: OFF, ERROR, WARN, INFO, DEBUG, TRACE, ALL
  vader: INFO

vader:
  mode: DEV
  swagger:
    # When true, core-server serves the OpenAPI spec at /v3/api-docs and Swagger UI at
    # /swagger-ui.html (documenting every REST controller, including the /data/* query API).
    enabled: true
  multipart:
    # Per-file upload limit. Applies to each individual file in a multipart request.
    maxFileSize: 10MB
    # Total request body limit. 51MB = 5 files × 10MB + 1MB for form fields.
    maxRequestSize: 51MB
    # Files larger than this threshold are buffered to disk rather than held in memory.
    fileSizeThreshold: 1MB
  database:
    # Allowable values are: H2
    # (Postgres/YugabyteDB-style swaps can be added here later, following the same pattern.)
    type: H2
    ddlAutoSetting: update
    # ANSI Database Level Isolation (https://en.wikipedia.org/wiki/Isolation_(database_systems))
    # values are: TRANSACTION_READ_UNCOMMITTED (0), TRANSACTION_READ_COMMITTED (1), TRANSACTION_REPEATABLE_READ (2), TRANSACTION_SERIALIZABLE (3)
    transactionIsolation: TRANSACTION_READ_COMMITTED
  orchestrator:
    # Allowable values are:
    #   local  - route prompts through an in-cluster Ollama instance
    #   static - return a fixed, canned decomposition (no LLM; used for deterministic tests)
    # (Remote/cloud-hosted LLM backends can be added here later, following the same pattern.)
    type: local
    local:
      # The Ollama model to download and run. Only used when orchestrator.type is "local".
      # Must support tool-calling and structured output for the orchestrator to work: qwen2.5
      # does both. Reasoning models (e.g. deepseek-r1) and sub-2B models tend to return
      # malformed plans and rarely call tools.
      model: qwen2.5:3b
      # When the in-cluster LLM is unreachable, fall back to the canned static task plan rather
      # than returning a 503. Keeps `helm test` / CI green without an Ollama deployment.
      fallbackToStatic: true
      # Bounds every individual Ollama HTTP call. Raise this if your hardware is slow enough that
      # legitimate (if verbose) generations routinely exceed it -- but keep it well under
      # agentHarness.deadlineSeconds, since a call this long already eats most of a task's budget.
      requestTimeoutSeconds: 300
  storage:
    # Allowable values are:
    #   database - store uploaded file contents as BLOBs in the relational database (default;
    #              requires no additional infrastructure)
    #   minio    - store uploaded file contents in an in-cluster MinIO object store
    # (Additional object-store backends can be added here later, following the same pattern.)
    type: database
    minio:
      # Only used when storage.type is "minio".
      endpoint: ""
      accessKey: ""
      secretKey: ""
      bucket: vader-files
  dao:
    # Upper bound on the page size any dynamic query (REST or MCP) may request.
    maxPageSize: 100
  scheduling:
    # Master switch for the background pollers (client-prompt inbox drain, backpressure
    # sampler). Turned off in unit/integration tests so they drive the inbox deterministically.
    enabled: true
  inbox:
    clientPrompt:
      # How often the inbox polls for pending prompt messages. A newly accepted prompt is also
      # drained immediately on enqueue, so this is mostly a safety net (e.g. after a restart).
      pollIntervalMs: 1000
      # Max prompts decomposed concurrently; also reported as egress.maxOpenMessages on the
      # backpressure endpoint.
      maxConcurrency: 1
    taskAssignment:
      # How often the inbox polls for task assignments ready to dispatch. A newly-enqueued
      # assignment is also drained immediately, so this is mostly a safety net.
      pollIntervalMs: 1000
      # Max assignments dispatched (Jobs created) concurrently. This throttles the *dispatch*
      # rate, not how many harness Jobs may run at once -- see agentHarness.maxAttemptsPerTask
      # and the scheduler for the actual concurrency the task graph produces.
      maxConcurrency: 5
    taskAttemptReview:
      # How often the inbox polls for terminal attempts awaiting review. A newly-enqueued review
      # is also drained immediately, so this is mostly a safety net.
      pollIntervalMs: 1000
      # Max attempts reviewed (evaluator verdict, then orchestrator reattempt decision if failed)
      # concurrently. Kept at 1 by default since both steps make LLM calls already serialized
      # through the single-worker requestQueue below -- raising this would only mean more callers
      # queued up waiting for that same worker, not more actual parallelism.
      maxConcurrency: 1
  llm:
    requestQueue:
      # How often LlmRequestInbox polls for pending LLM requests. Much shorter than the other
      # inboxes' 1000ms default: this is the only path by which a replica other than the one that
      # enqueued a request (or the one already mid-request for an earlier one) ever notices a
      # freed claim slot, so it directly adds to how long every blocked caller waits.
      drainPollIntervalMs: 200
      # How often a caller blocked in LlmRequestQueue re-checks whether its own request has been
      # processed yet.
      resultPollIntervalMs: 100
      # A caller gives up once no request on the queue -- anywhere, by any replica -- has been
      # claimed for this long. This, not maxWaitSeconds, is the real patience control: a deep but
      # healthy queue keeps a caller waiting indefinitely (up to maxWaitSeconds) as long as it
      # keeps seeing forward progress: only a genuinely stuck backend (nothing claimed at all)
      # trips this.
      stallTimeoutSeconds: 60
      # Absolute backstop regardless of whether the queue is still making progress, so a queue
      # that never actually stops moving (but never keeps up either) cannot block a caller
      # forever.
      maxWaitSeconds: 1800
  backpressure:
    # How often queue depth is sampled to derive ingress.queueRatePerMinute.
    sampleIntervalMs: 15000
  mcp:
    databaseQuery:
      # When true, core-server exposes read-only vader-database query tools
      # (list_queryable_entities / query_database / count_matching) over the MCP endpoint.
      enabled: true
    backpressure:
      # When true, core-server exposes the inbox/outbox back pressure over the MCP endpoint
      # (list_backpressure_queues / get_backpressure), mirroring the REST /backpressure API.
      # Off by default: this is an operator/ops-debugging surface, not something a
      # task-decomposition or task-execution agent needs, and every agent-harness inference turn
      # offers the full registered tool set, so leaving it on just crowds out the tools a task
      # actually needs. The REST /backpressure endpoint is unaffected either way.
      enabled: false
    objectStorage:
      # When true, core-server exposes get_object_content over the MCP endpoint: an agent hands
      # it an ObjectMetadata id and gets the object's content back as base64, whether it's
      # actually stored in MinIO or the database -- the tool hides that distinction.
      enabled: true
      # Objects larger than this many bytes are rejected by the tool (with the REST download URL
      # to use instead) rather than inlined as base64, to keep a single tool result from blowing
      # the calling model's context budget.
      maxInlineBytes: 2097152
    taskUpdate:
      # When true, core-server exposes post_task_update over the MCP endpoint: a task-execution
      # agent can leave an interim progress note against the task it is working on. Never a
      # pass/fail/timeout verdict -- those stay reserved for an independent evaluator (and, for
      # timeouts, the reaper) -- and never against another task, regardless of what the calling
      # model supplies.
      enabled: true
  operators:
    # Kubernetes operators core-server runs, each also exposed to LLMs as MCP tools.
    # Master switch: constructs the shared Kubernetes client and enables the RBAC the
    # operators need. Must be true for ANY individual operator below to start.
    # (Additional operators can be added here later, following the same pattern.)
    enabled: true
    pythonSandbox:
      # When true (and operators.enabled is true), core-server runs the Python sandbox
      # operator and publishes its create/list/delete/run tools over the MCP SSE endpoint.
      enabled: true
      # The Deployment running core-server; the operator watches it and cascade-deletes every
      # sandbox if core-server itself is removed from the cluster.
      ownerDeploymentName: vader-core-server
      sandbox:
        # Container image every sandbox pod runs: core-python-sandbox-server, a small HTTP
        # server (built from services/core/python/core-python-sandbox-server) that runs
        # submitted code as a subprocess against a persistent per-pod workspace and returns its
        # stdout/stderr/exit code. pandas/openpyxl are preinstalled so an agent can analyze an
        # uploaded spreadsheet with no setup step.
        image: jeremyacase/vader-core-python-sandbox-server:latest
        # Ceiling on how long a single run_python_code call may run inside the sandbox, in
        # seconds -- enforced by the sandbox server itself regardless of what a caller requests.
        execTimeoutSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
    agentHarness:
      # When true (and operators.enabled is true), core-server runs the agent-harness operator:
      # it creates one Job per dispatched TaskAttempt, and does nothing else on its own -- the
      # scheduler decides *when* to dispatch, this only turns a dispatch into a real Job.
      enabled: true
      # The Deployment running core-server; the operator watches it and cascade-deletes every
      # in-flight harness Job if core-server itself is removed from the cluster.
      ownerDeploymentName: vader-core-server
  # Runtime bounds for every agent-harness Job, and the scheduler's retry policy. A harness
  # always proxies every LLM call through core-server's /agent/inference -- these numbers, not
  # anything the harness process enforces on its own, are the authoritative budget.
  agentHarness:
    # Turn cap enforced server-side; the harness also tracks its own copy locally.
    maxTurns: 20
    # Token cap enforced server-side; the harness also tracks its own copy locally.
    maxTokens: 200000
    # Wall-clock deadline (from first contact), used both as the value handed to the harness and
    # as the Job's own activeDeadlineSeconds -- a hard Kubernetes-level backstop independent of
    # whether the harness process's own timeout logic runs correctly.
    deadlineSeconds: 600
    # A task whose attempt ends FAILED / TIMED_OUT / STALLED is retried (a fresh TaskAttempt, a
    # fresh Job) until this many attempts are spent, then treated as permanently failed.
    maxAttemptsPerTask: 3
    # How long a finished Job (and its logs) stick around before Kubernetes garbage-collects it.
    ttlSecondsAfterFinished: 3600
    reaper:
      # How often to scan for stuck attempts (dispatched-but-never-started, or gone silent) --
      # crash, OOM kill, network partition, or a Job that never scheduled at all. A harness has
      # no way to report its own death, so this is the only thing that notices.
      pollIntervalMs: 30000
      # An open attempt is reaped once this many seconds pass with no sign of life (last
      # heartbeat, or dispatch time, or creation time) beyond deadlineSeconds -- i.e. the total
      # allowed silence is deadlineSeconds + gracePeriodSeconds, covering scheduling/image-pull
      # delay and the final network round trip on top of the harness's own deadline.
      gracePeriodSeconds: 300
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
  components:
    core:
      coreServer:
        image:
          registry: jeremyacase
          repository: vader-core-server
          tag: latest
      agentHarness:
        image:
          registry: jeremyacase
          repository: vader-core-agent-harness
          tag: latest
      coreUi:
        replicas: 1
        image:
          registry: jeremyacase
          repository: vader-core-ui
          tag: latest
        service:
          nodePort: 30081
      ollama:
        image:
          registry: docker.io
          repository: ollama/ollama
          tag: latest
          # Always pulled from the registry, unlike core-server/core-ui which get built and
          # loaded locally in dev -- so this isn't tied to infrastructure.image.pullPolicy.
          pullPolicy: IfNotPresent
        service:
          port: 11434

k8s:
  serviceAccount:
    create: true
    name: vader
  autoscaling:
    enabled: false

infrastructure:
  image:
    pullPolicy: IfNotPresent

telemetry:
  prometheus:
    enabled: true
