apiVersion: v1
kind: ConfigMap
metadata:
  name: vader-core-server-config
data:
  application.yaml: |

    logging:
      level:
        org.vader: {{ .Values.logging.vader }}

    springdoc:
      api-docs:
        enabled: {{ .Values.vader.swagger.enabled }}
      swagger-ui:
        enabled: {{ .Values.vader.swagger.enabled }}
        path: /swagger-ui.html

    management:
      endpoint:
        info:
          enabled: true
          java:
            enabled: true
          build:
            enabled: true
        health:
          probes:
            enabled: true
          show-components: always
          show-details: always
        prometheus:
          enabled: {{ .Values.telemetry.prometheus.enabled }}
      endpoints:
        web:
          exposure:
            include: info, health{{- if .Values.telemetry.prometheus.enabled }}, prometheus{{- end }}
      metrics:
        tags:
          application: ${spring.application.name}

    spring:
      server:
        port: {{ .Values.convenience.variables.spring.port }}

      application:
        name: core-server

      ai:
        # Only wire an Ollama chat model when the local orchestrator is active; otherwise
        # disable chat-model autoconfig entirely so the static / test contexts need no LLM.
        model:
          chat: {{ if eq .Values.vader.orchestrator.type "local" }}ollama{{ else }}none{{ end }}
        {{- if eq .Values.vader.orchestrator.type "local" }}
        ollama:
          base-url: http://vader-ollama:{{ .Values.vader.components.core.ollama.service.port }}
          chat:
            options:
              model: {{ .Values.vader.orchestrator.local.model }}
              temperature: 0
        # Bounded retry so an unreachable LLM degrades to the fallback plan in seconds, not
        # minutes, when fallback-to-static is on.
        retry:
          max-attempts: 2
          backoff:
            initial-interval: 1s
            max-interval: 5s
        {{- end }}
        mcp:
          server:
            name: vader-core-server
            version: {{ .Chart.Version | quote }}
            type: SYNC

      http:
        client:
          connect-timeout: 10s
          read-timeout: 5m

      servlet:
        multipart:
          max-file-size: {{ .Values.vader.multipart.maxFileSize | default "10MB" }}
          max-request-size: {{ .Values.vader.multipart.maxRequestSize | default "51MB" }}
          file-size-threshold: {{ .Values.vader.multipart.fileSizeThreshold | default "1MB" }}

      datasource:
        driverClassName: org.h2.Driver
        url: jdbc:h2:mem:vaderDb;DB_CLOSE_DELAY=-1
        username: sa
        password: ""
        hikari:
          transaction-isolation: {{ .Values.vader.database.transactionIsolation }}
      jpa:
        hibernate:
          ddl-auto: {{ .Values.vader.database.ddlAutoSetting }}
        properties:
          hibernate:
            generate_statistics: false
            format_sql: true
      h2:
        console:
          enabled: true
          path: /h2-console

    vader:
      mode: {{ .Values.vader.mode | default "PROD" }}
      orchestrator:
        type: {{ .Values.vader.orchestrator.type | default "local" }}
        {{- if eq .Values.vader.orchestrator.type "local" }}
        local:
          model: {{ .Values.vader.orchestrator.local.model }}
          # When the in-cluster LLM is unreachable, return the canned static plan instead of
          # failing -- lets `helm test` / CI pass with no Ollama in the cluster.
          fallback-to-static: {{ .Values.vader.orchestrator.local.fallbackToStatic }}
          # Bounds every Ollama HTTP call (decomposition, inference turns, evaluation,
          # reattempt decisions, synthesis); the JDK HTTP client Spring auto-detects here has no
          # timeout of its own, so an unbounded call would otherwise wedge the single-worker LLM
          # queue forever instead of failing and freeing it for the next request.
          request-timeout-seconds: {{ .Values.vader.orchestrator.local.requestTimeoutSeconds }}
        {{- end }}
      storage:
        type: {{ .Values.vader.storage.type | default "database" }}
        {{- if eq .Values.vader.storage.type "minio" }}
        minio:
          endpoint: {{ .Values.vader.storage.minio.endpoint }}
          access-key: {{ .Values.vader.storage.minio.accessKey }}
          secret-key: {{ .Values.vader.storage.minio.secretKey }}
          bucket: {{ .Values.vader.storage.minio.bucket | default "vader-files" }}
        {{- end }}
      dao:
        max-page-size: {{ .Values.vader.dao.maxPageSize }}
      scheduling:
        enabled: {{ .Values.vader.scheduling.enabled }}
      inbox:
        client-prompt:
          poll-interval-ms: {{ .Values.vader.inbox.clientPrompt.pollIntervalMs }}
          max-concurrency: {{ .Values.vader.inbox.clientPrompt.maxConcurrency }}
        task-assignment:
          poll-interval-ms: {{ .Values.vader.inbox.taskAssignment.pollIntervalMs }}
          max-concurrency: {{ .Values.vader.inbox.taskAssignment.maxConcurrency }}
        task-attempt-review:
          poll-interval-ms: {{ .Values.vader.inbox.taskAttemptReview.pollIntervalMs }}
          max-concurrency: {{ .Values.vader.inbox.taskAttemptReview.maxConcurrency }}
      llm:
        request-queue:
          drain-poll-interval-ms: {{ .Values.vader.llm.requestQueue.drainPollIntervalMs }}
          result-poll-interval-ms: {{ .Values.vader.llm.requestQueue.resultPollIntervalMs }}
          stall-timeout-seconds: {{ .Values.vader.llm.requestQueue.stallTimeoutSeconds }}
          max-wait-seconds: {{ .Values.vader.llm.requestQueue.maxWaitSeconds }}
      backpressure:
        sample-interval-ms: {{ .Values.vader.backpressure.sampleIntervalMs }}
      mcp:
        database-query:
          enabled: {{ .Values.vader.mcp.databaseQuery.enabled }}
        backpressure:
          enabled: {{ .Values.vader.mcp.backpressure.enabled }}
        object-storage:
          enabled: {{ .Values.vader.mcp.objectStorage.enabled }}
          # `int` avoids Helm/Go rendering this as scientific notation (e.g. 2.097152e+06),
          # which plain interpolation of a non-"round" number this size is prone to.
          max-inline-bytes: {{ int .Values.vader.mcp.objectStorage.maxInlineBytes }}
        task-update:
          enabled: {{ .Values.vader.mcp.taskUpdate.enabled }}
      kubernetes:
        namespace: {{ .Release.Namespace }}
      operators:
        enabled: {{ .Values.vader.operators.enabled }}
        python-sandbox:
          enabled: {{ .Values.vader.operators.pythonSandbox.enabled }}
          owner-deployment-name: {{ .Values.vader.operators.pythonSandbox.ownerDeploymentName }}
          sandbox:
            image: {{ .Values.vader.operators.pythonSandbox.sandbox.image }}
            image-pull-policy: {{ .Values.infrastructure.image.pullPolicy }}
            exec-timeout-seconds: {{ .Values.vader.operators.pythonSandbox.sandbox.execTimeoutSeconds }}
            # Passed to the sandbox pod as SANDBOX_LOG_LEVEL, so its log verbosity tracks
            # core-server's own (logging.vader) the same way agent-harness's log-level does.
            log-level: {{ .Values.logging.vader }}
            resources:
              requests:
                cpu: {{ .Values.vader.operators.pythonSandbox.sandbox.resources.requests.cpu }}
                memory: {{ .Values.vader.operators.pythonSandbox.sandbox.resources.requests.memory }}
              limits:
                cpu: {{ .Values.vader.operators.pythonSandbox.sandbox.resources.limits.cpu }}
                memory: {{ .Values.vader.operators.pythonSandbox.sandbox.resources.limits.memory }}
        agent-harness:
          enabled: {{ .Values.vader.operators.agentHarness.enabled }}
          owner-deployment-name: {{ .Values.vader.operators.agentHarness.ownerDeploymentName }}
      agent-harness:
        image: {{ include "vader.core.agentHarness.image" . | quote }}
        image-pull-policy: {{ .Values.infrastructure.image.pullPolicy }}
        core-server-url: http://vader-core-server:{{ .Values.convenience.variables.spring.port }}
        # Passed to each harness Job as RUST_LOG, so the harness's log verbosity tracks
        # core-server's own (logging.vader) rather than needing a second knob kept in sync by
        # hand. env_logger's level names are case-insensitive, so core-server's "INFO"-style
        # value works unchanged.
        log-level: {{ .Values.logging.vader }}
        max-turns: {{ .Values.vader.agentHarness.maxTurns }}
        max-tokens: {{ .Values.vader.agentHarness.maxTokens }}
        deadline-seconds: {{ .Values.vader.agentHarness.deadlineSeconds }}
        max-attempts-per-task: {{ .Values.vader.agentHarness.maxAttemptsPerTask }}
        ttl-seconds-after-finished: {{ .Values.vader.agentHarness.ttlSecondsAfterFinished }}
        reaper:
          poll-interval-ms: {{ .Values.vader.agentHarness.reaper.pollIntervalMs }}
          grace-period-seconds: {{ .Values.vader.agentHarness.reaper.gracePeriodSeconds }}
        resources:
          requests:
            cpu: {{ .Values.vader.agentHarness.resources.requests.cpu }}
            memory: {{ .Values.vader.agentHarness.resources.requests.memory }}
          limits:
            cpu: {{ .Values.vader.agentHarness.resources.limits.cpu }}
            memory: {{ .Values.vader.agentHarness.resources.limits.memory }}
