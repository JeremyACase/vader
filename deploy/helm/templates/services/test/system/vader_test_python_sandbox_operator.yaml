{{- if .Values.vader.operators.pythonSandbox.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: vader-python-sandbox-operator-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # Only rendered when vader.operators.pythonSandbox.enabled is true. Drives the operator's
    # REST surface (which shares its service layer with the MCP tools) through a full
    # create -> list -> execute -> delete -> list round trip against the real cluster,
    # including a real core-python-sandbox-server call and a check that a staged file
    # survives across calls.
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.6.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          SERVER="http://vader-core-server:{{ .Values.convenience.variables.spring.port }}"
          BASE="$SERVER/vader/core-server/python-sandbox/sandboxes"

          echo "== Health check =="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVER/actuator/health" || true)
          [ "$STATUS" = "200" ] || { echo "❌ health check got $STATUS"; exit 1; }
          echo "✅ core-server healthy"

          echo "== Create a sandbox =="
          BODY_FILE=$(mktemp)
          STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" --max-time 30 \
            -X POST "$BASE" -H "Content-Type: application/json" \
            -d '{"name":"helm-test"}' || true)
          BODY=$(cat "$BODY_FILE")
          echo "HTTP $STATUS -- $BODY"
          [ "$STATUS" = "200" ] || { echo "❌ expected HTTP 200, got $STATUS"; exit 1; }
          NAME=$(echo "$BODY" | sed -n 's/.*"name":"\([^"]*\)".*/\1/p')
          [ -n "$NAME" ] || { echo "❌ no sandbox name in response"; exit 1; }
          echo "✅ created sandbox $NAME"

          echo "== List includes the new sandbox =="
          BODY=$(curl -s --max-time 15 "$BASE" || true)
          echo "$BODY"
          echo "$BODY" | grep -q "\"$NAME\"" || { echo "❌ list missing $NAME"; exit 1; }
          echo "✅ list contains $NAME"

          echo "== Run code in the sandbox (retrying until the exec server is ready) =="
          i=0
          STATUS=000
          while [ $i -lt 20 ]; do
            BODY_FILE=$(mktemp)
            STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" --max-time 15 \
              -X POST "$BASE/$NAME/execute" -H "Content-Type: application/json" \
              -d '{"code":"print(1 + 1)"}' || true)
            BODY=$(cat "$BODY_FILE")
            [ "$STATUS" = "200" ] && echo "$BODY" | grep -q '"exitCode":0' && break
            i=$((i+1))
            sleep 3
          done
          echo "HTTP $STATUS -- $BODY"
          [ "$STATUS" = "200" ] || { echo "❌ expected HTTP 200 running code, got $STATUS"; exit 1; }
          echo "$BODY" | grep -q '"stdout":"2' || { echo "❌ unexpected stdout: $BODY"; exit 1; }
          echo "✅ ran code in $NAME and got the expected output"

          echo "== A file staged in one call is still there for a later call =="
          STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" --max-time 15 \
            -X POST "$BASE/$NAME/execute" -H "Content-Type: application/json" \
            -d '{"code":"pass","files":{"greeting.txt":"aGVsbG8="}}' || true)
          [ "$STATUS" = "200" ] || { echo "❌ expected HTTP 200 staging a file, got $STATUS"; exit 1; }
          STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" --max-time 15 \
            -X POST "$BASE/$NAME/execute" -H "Content-Type: application/json" \
            -d '{"code":"print(open(\"greeting.txt\").read())"}' || true)
          BODY=$(cat "$BODY_FILE")
          echo "HTTP $STATUS -- $BODY"
          [ "$STATUS" = "200" ] || { echo "❌ expected HTTP 200 reading staged file, got $STATUS"; exit 1; }
          echo "$BODY" | grep -q '"stdout":"hello' || { echo "❌ staged file not readable: $BODY"; exit 1; }
          echo "✅ a file staged in one call was readable in a later call"

          echo "== Delete the sandbox =="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -X DELETE "$BASE/$NAME" || true)
          [ "$STATUS" = "204" ] || { echo "❌ expected HTTP 204 on delete, got $STATUS"; exit 1; }
          echo "✅ deleted $NAME"

          echo "== List no longer includes the sandbox =="
          sleep 2
          BODY=$(curl -s --max-time 15 "$BASE" || true)
          echo "$BODY"
          echo "$BODY" | grep -q "\"$NAME\"" && { echo "❌ $NAME still listed"; exit 1; }
          echo "✅ $NAME is gone"

          echo "🎉 python-sandbox operator round trip passed"
{{- end }}
