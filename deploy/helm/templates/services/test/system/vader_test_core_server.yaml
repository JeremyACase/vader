apiVersion: v1
kind: Pod
metadata:
  name: vader-core-server-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # CI installs with configurations/test/test.yaml (vader.orchestrator.type=static): the
    # static strategy returns a canned decomposition instantly, no Ollama needed. Prompt intake
    # is asynchronous -- the POST returns 202 with a receipt and a downstream inbox builds the
    # workflow -- so the checks below submit, then poll the workflow query API for the result.
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.6.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          SERVER="http://vader-core-server:{{ .Values.convenience.variables.spring.port }}"
          PROMPT_URL="$SERVER/vader/core-server/client-prompt"
          WORKFLOW_QUERY="$SERVER/vader/core-server/data/workflow/query/params"

          # Submits a prompt (optionally with a file), asserts a 202 + receipt, then polls the
          # workflow query API by clientPrompt id until the decomposition appears.
          # Usage: submit_and_await "<prompt text>" [file-path]
          submit_and_await() {
            TEXT="$1"
            FILE="$2"
            BODY_FILE=$(mktemp)
            if [ -n "$FILE" ]; then
              STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" --max-time 30 \
                -X POST "$PROMPT_URL" -F "text=$TEXT" -F "files=@$FILE;type=text/plain" || true)
            else
              STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" --max-time 30 \
                -X POST "$PROMPT_URL" -F "text=$TEXT" || true)
            fi
            BODY=$(cat "$BODY_FILE")
            echo "HTTP $STATUS -- $BODY"
            [ "$STATUS" = "202" ] || { echo "❌ expected HTTP 202, got $STATUS"; exit 1; }
            echo "$BODY" | grep -q '"payloadModelType":"ClientPrompt"' \
              || { echo "❌ receipt missing payloadModelType"; exit 1; }

            ID=$(echo "$BODY" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
            [ -n "$ID" ] || { echo "❌ receipt has no id"; exit 1; }

            echo "   awaiting workflow for prompt $ID ..."
            i=0
            while [ $i -lt 40 ]; do
              WF=$(curl -s --max-time 10 \
                "$WORKFLOW_QUERY?page=0&size=1&sort-descending=true&sort-by-fields=createdAt&clientPrompt.id=$ID" || true)
              if echo "$WF" | grep -q '"objective"'; then
                echo "$WF" | grep -q '"tasks"' \
                  || { echo "❌ workflow has no tasks: $WF"; exit 1; }
                echo "✅ workflow was built for prompt $ID"
                return 0
              fi
              i=$((i+1))
              sleep 3
            done
            echo "❌ timed out waiting for a workflow for prompt $ID"
            exit 1
          }

          echo "== Health check =="
          STATUS=000
          i=1
          while [ $i -le 60 ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$SERVER/actuator/health" || true)
            [ "$STATUS" = "200" ] && break
            echo "waiting for core-server ($i/60): got $STATUS"
            sleep 5
            i=$((i+1))
          done
          [ "$STATUS" = "200" ] || { echo "❌ health check got $STATUS"; exit 1; }
          echo "✅ core-server healthy"

          echo "== End-to-end: prompt -> outbox -> inbox -> workflow =="
          submit_and_await "Plan a simple birthday party for a friend."

          echo "== Multipart: prompt with one attached file =="
          echo "hello world" > /tmp/test-attachment.txt
          submit_and_await "Summarize the attached file." /tmp/test-attachment.txt

          echo "== Backpressure endpoint =="
          BP=$(curl -s --max-time 10 "$SERVER/vader/core-server/backpressure/ClientPrompt" || true)
          echo "🔍 $BP"
          echo "$BP" | grep -q '"ingress"' || { echo "❌ backpressure missing ingress"; exit 1; }
          echo "$BP" | grep -q '"egress"' || { echo "❌ backpressure missing egress"; exit 1; }
          BP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "$SERVER/vader/core-server/backpressure/Bogus" || true)
          [ "$BP_STATUS" = "400" ] || { echo "❌ unknown model type: expected 400, got $BP_STATUS"; exit 1; }
          echo "✅ backpressure endpoint reports ingress/egress and rejects unknown types"

          echo "== Validation: 6 files should be rejected with 400 =="
          i=1; while [ $i -le 6 ]; do printf "content %d" $i > "/tmp/excess-file-$i.txt"; i=$((i+1)); done
          BODY_FILE=$(mktemp)
          STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" --max-time 10 \
            -X POST "$PROMPT_URL" \
            -F "text=This should be rejected." \
            -F "files=@/tmp/excess-file-1.txt" \
            -F "files=@/tmp/excess-file-2.txt" \
            -F "files=@/tmp/excess-file-3.txt" \
            -F "files=@/tmp/excess-file-4.txt" \
            -F "files=@/tmp/excess-file-5.txt" \
            -F "files=@/tmp/excess-file-6.txt" || true)
          BODY=$(cat "$BODY_FILE")
          echo "HTTP $STATUS -- $BODY"
          [ "$STATUS" = "400" ] || { echo "❌ expected HTTP 400 for 6 files, got $STATUS"; exit 1; }
          echo "$BODY" | grep -q '"validation_failed"' || { echo "❌ response missing validation_failed error code"; exit 1; }
          echo "✅ 6-file upload was correctly rejected"

          echo "🎉 all core-server checks passed"
