apiVersion: v1
kind: Pod
metadata:
  name: vader-core-server-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # Requires the release to be installed with configurations/test/test.yaml, which sets
    # vader.orchestrator.type=static. The static strategy returns a canned decomposition
    # immediately; no Ollama deployment or model download is required.
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.6.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          SERVER="http://vader-core-server:{{ .Values.convenience.variables.spring.port }}"
          PROMPT_URL="$SERVER/vader/core-server/client-prompt"

          echo "== Health check =="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVER/actuator/health" || true)
          [ "$STATUS" = "200" ] || { echo "❌ health check got $STATUS"; exit 1; }
          echo "✅ core-server healthy"

          echo "== End-to-end: prompt -> core-server -> decomposition =="
          BODY_FILE=$(mktemp)
          STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" --max-time 10 \
            -X POST "$PROMPT_URL" \
            -F "text=Plan a simple birthday party for a friend." || true)
          BODY=$(cat "$BODY_FILE")

          echo "HTTP $STATUS"
          echo "🔍 Response body:"
          echo "$BODY"

          [ "$STATUS" = "200" ] || { echo "❌ expected HTTP 200, got $STATUS"; exit 1; }
          echo "$BODY" | grep -q '"objective"' || { echo "❌ response has no objective"; exit 1; }
          echo "$BODY" | grep -q '"tasks"' || { echo "❌ response has no tasks"; exit 1; }

          echo "✅ prompt was routed through core-server and a decomposition came back"

          echo "== Multipart: prompt with one attached file =="
          echo "hello world" > /tmp/test-attachment.txt
          BODY_FILE=$(mktemp)
          STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" --max-time 10 \
            -X POST "$PROMPT_URL" \
            -F "text=Plan a simple birthday party for a friend." \
            -F "files=@/tmp/test-attachment.txt;type=text/plain" || true)
          BODY=$(cat "$BODY_FILE")

          echo "HTTP $STATUS"
          echo "🔍 Response body:"
          echo "$BODY"

          [ "$STATUS" = "200" ] || { echo "❌ expected HTTP 200 with file attachment, got $STATUS"; exit 1; }
          echo "$BODY" | grep -q '"objective"' || { echo "❌ response has no objective"; exit 1; }
          echo "$BODY" | grep -q '"tasks"' || { echo "❌ response has no tasks"; exit 1; }

          echo "✅ prompt with one attached file was accepted and decomposed"

          echo "== Validation: 6 files should be rejected with 400 =="
          i=1; while [ $i -le 6 ]; do printf "content %d" $i > "/tmp/excess-file-$i.txt"; i=$((i+1)); done
          BODY_FILE=$(mktemp)
          STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" --max-time 10 \
            -X POST "$PROMPT_URL" \
            -F "text=This should be rejected." \
            -F "files=@/tmp/excess-file-1.txt" \
            -F "files=@/tmp/excess-file-2.txt" \
            -F "files=@/tmp/excess-file-3.txt" \
            -F "files=@/tmp/excess-file-4.txt" \
            -F "files=@/tmp/excess-file-5.txt" \
            -F "files=@/tmp/excess-file-6.txt" || true)
          BODY=$(cat "$BODY_FILE")

          echo "HTTP $STATUS"
          echo "🔍 Response body:"
          echo "$BODY"

          [ "$STATUS" = "400" ] || { echo "❌ expected HTTP 400 for 6 files, got $STATUS"; exit 1; }
          echo "$BODY" | grep -q '"validation_failed"' || { echo "❌ response missing validation_failed error code"; exit 1; }

          echo "✅ 6-file upload was correctly rejected"

          echo "🎉 all core-server checks passed"
