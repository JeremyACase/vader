{{- if and .Values.vader.operators.enabled .Values.vader.operators.agentHarness.enabled .Values.vader.operators.pythonSandbox.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: vader-test-object-upload
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # Only rendered when both the agent-harness and Python sandbox operators are enabled.
    # Checks a task agent's upload_object tool end to end: a prompt carrying
    # ScriptedChatModelStub's upload marker is planned as one task whose real harness Job runs
    # code in a real sandbox to write scripted-report.md, then uploads it. The test then finds
    # the stored object through the task attempt that produced it and downloads it through the
    # REST endpoint -- never knowing or caring which storage strategy the release runs.
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.6.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          SERVER="http://vader-core-server:{{ .Values.convenience.variables.spring.port }}"
          PROMPT_URL="$SERVER/vader/core-server/client-prompt"
          WORKFLOW_QUERY="$SERVER/vader/core-server/data/workflow/query/params"
          TOOL_CALL_QUERY="$SERVER/vader/core-server/data/task-attempt-tool-call/query/params"
          OM_QUERY="$SERVER/vader/core-server/data/object-metadata/query/params"
          # Must match ScriptedChatModelStub's UPLOAD_SCRIPT_MARKER, UPLOADED_REPORT_FILENAME and
          # UPLOADED_REPORT_CONTENT.
          MARKER="[scripted:upload-object]"
          REPORT_FILENAME="scripted-report.md"
          REPORT_CONTENT="# Scripted report"

          echo "== Health check =="
          STATUS=000
          i=1
          while [ $i -le 60 ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$SERVER/actuator/health" || true)
            [ "$STATUS" = "200" ] && break
            echo "waiting for core-server ($i/60): got $STATUS"
            sleep 5
            i=$((i+1))
          done
          [ "$STATUS" = "200" ] || { echo "❌ health check got $STATUS"; exit 1; }
          echo "✅ core-server healthy"

          echo "== Submit a prompt that plays the upload script =="
          BODY_FILE=$(mktemp)
          STATUS=$(curl -s -o "$BODY_FILE" -w "%{http_code}" --max-time 30 \
            -X POST "$PROMPT_URL" -F "text=Write a short report and save it. $MARKER" || true)
          BODY=$(cat "$BODY_FILE")
          echo "HTTP $STATUS -- $BODY"
          [ "$STATUS" = "202" ] || { echo "❌ expected HTTP 202, got $STATUS"; exit 1; }
          ID=$(echo "$BODY" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          [ -n "$ID" ] || { echo "❌ receipt has no id"; exit 1; }
          echo "✅ prompt accepted as $ID"

          echo "== Waiting for the harness Job to write, upload, and finish =="
          echo "   (its first code run also provisions the attempt's sandbox pod)"
          WORKFLOW=""
          i=1
          while [ $i -le 80 ]; do
            WORKFLOW=$(curl -s --max-time 10 \
              "$WORKFLOW_QUERY?page=0&size=1&sort-descending=true&sort-by-fields=createdAt&clientPrompt.id=$ID" || true)
            if echo "$WORKFLOW" | grep -q '"status":"SUCCEEDED"'; then
              break
            fi
            if echo "$WORKFLOW" | grep -q '"status":"FAILED"'; then
              echo "❌ workflow settled as FAILED: $WORKFLOW"
              exit 1
            fi
            i=$((i+1))
            sleep 3
          done
          echo "$WORKFLOW" | grep -q '"status":"SUCCEEDED"' \
            || { echo "❌ timed out waiting for the workflow to succeed: $WORKFLOW"; exit 1; }
          echo "✅ workflow reached SUCCEEDED"

          echo "== The harness called upload_object and it succeeded =="
          # Latest upload_object call: this is the only scripted prompt that makes one.
          TOOL_CALL=$(curl -s --max-time 10 \
            "$TOOL_CALL_QUERY?page=0&size=1&sort-descending=true&sort-by-fields=createdAt&toolName=upload_object" || true)
          echo "🔍 $TOOL_CALL"
          echo "$TOOL_CALL" | grep -q '"toolName":"upload_object"' \
            || { echo "❌ no task-attempt-tool-call row for upload_object"; exit 1; }
          echo "$TOOL_CALL" | grep -qF '\"error\"' \
            && { echo "❌ upload_object returned an error"; exit 1; }
          ATTEMPT_ID=$(echo "$TOOL_CALL" | sed -n 's/.*"taskAttemptId":"\([^"]*\)".*/\1/p')
          OBJECT_ID=$(echo "$TOOL_CALL" | sed -n 's/.*\\"id\\":\\"\([^\\]*\)\\".*/\1/p')
          [ -n "$ATTEMPT_ID" ] || { echo "❌ tool-call row has no taskAttemptId"; exit 1; }
          [ -n "$OBJECT_ID" ] || { echo "❌ upload_object result has no object id"; exit 1; }
          echo "✅ attempt $ATTEMPT_ID uploaded object $OBJECT_ID"

          echo "== The stored object is linked to the attempt that uploaded it =="
          OM_BODY=$(curl -s --max-time 10 "$OM_QUERY?page=0&size=5&taskAttempt.id=$ATTEMPT_ID" || true)
          echo "🔍 $OM_BODY"
          echo "$OM_BODY" | grep -qF "\"id\":\"$OBJECT_ID\"" \
            || { echo "❌ object $OBJECT_ID not found under attempt $ATTEMPT_ID"; exit 1; }
          echo "$OM_BODY" | grep -qF "\"originalFilename\":\"$REPORT_FILENAME\"" \
            || { echo "❌ unexpected filename"; exit 1; }
          echo "$OM_BODY" | grep -qF '"contentType":"text/markdown"' \
            || { echo "❌ content type was not inferred as text/markdown"; exit 1; }
          echo "$OM_BODY" | grep -qF "\"taskAttemptId\":\"$ATTEMPT_ID\"" \
            || { echo "❌ metadata does not carry the producing attempt's id"; exit 1; }
          echo "✅ metadata records the filename, inferred content type, and producing attempt"

          echo "== Download returns exactly what the agent's code wrote =="
          OUT_FILE=$(mktemp)
          STATUS=$(curl -s -o "$OUT_FILE" -w "%{http_code}" --max-time 15 \
            "$SERVER/vader/core-server/object-storage/$OBJECT_ID/content" || true)
          [ "$STATUS" = "200" ] || { echo "❌ expected HTTP 200 downloading, got $STATUS"; exit 1; }
          [ "$(cat "$OUT_FILE")" = "$REPORT_CONTENT" ] \
            || { echo "❌ downloaded content '$(cat "$OUT_FILE")' did not match"; exit 1; }
          echo "✅ downloaded bytes match the file written in the sandbox"

          echo "🎉 object-upload system test passed"
{{- end }}
