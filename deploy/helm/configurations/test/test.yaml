# Helm values for the "test" Vader deployment configuration.
vader:
  orchestrator:
    # Static, canned decomposition: no Ollama deployment, no model download, deterministic
    # Helm test. Swap to "local" to exercise the real LLM path.
    type: static
  components:
    core:
      coreServer:
        image:
          registry: jeremyacase
          repository: vader-core-server
          tag: latest
      coreUi:
        image:
          registry: jeremyacase
          repository: vader-core-ui
          tag: latest

infrastructure:
  image:
    pullPolicy: IfNotPresent
