# Helm values for the "test" Vader deployment configuration.
vader:
  # The only mode in which canned results are permitted -- required by orchestrator.type
  # "scripted" below.
  mode: TEST
  orchestrator:
    # A scripted chat model stands in for the LLM: every real prompt, queue and response parser
    # runs, but the model's replies are canned, so there's no Ollama deployment, no model
    # download, and a deterministic Helm test -- including every agent-harness Job's inference
    # turns. Swap to "local" to exercise a real LLM.
    type: scripted
  operators:
    enabled: true
    agentHarness:
      enabled: true
  components:
    core:
      coreServer:
        image:
          registry: jeremyacase
          repository: vader-core-server
          tag: latest
      coreUi:
        image:
          registry: jeremyacase
          repository: vader-core-ui
          tag: latest
      agentHarness:
        image:
          registry: jeremyacase
          repository: vader-core-agent-harness
          tag: latest

infrastructure:
  image:
    pullPolicy: IfNotPresent

systemTests:
  zapScan:
    enabled: true
