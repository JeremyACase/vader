# Helm values for the "test" Vader deployment configuration.
vader:
  # The only mode in which static, canned results are permitted -- required by orchestrator.type
  # "static" below.
  mode: TEST
  orchestrator:
    # Static, canned decomposition: no Ollama deployment, no model download, deterministic
    # Helm test. Swap to "local" to exercise the real LLM path. Also drives the inference
    # gateway (StaticInferenceGatewayStrategy) a dispatched agent-harness Job calls into --
    # same switch, so the harness system test is deterministic too, with no Ollama needed.
    type: static
  operators:
    enabled: true
    agentHarness:
      enabled: true
  components:
    core:
      coreServer:
        image:
          registry: jeremyacase
          repository: vader-core-server
          tag: latest
      coreUi:
        image:
          registry: jeremyacase
          repository: vader-core-ui
          tag: latest
      agentHarness:
        image:
          registry: jeremyacase
          repository: vader-core-agent-harness
          tag: latest

infrastructure:
  image:
    pullPolicy: IfNotPresent
