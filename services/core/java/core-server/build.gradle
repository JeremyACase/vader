plugins {
    id 'org.springframework.boot' version "${SPRING_BOOT_VERSION}"
    id 'java'
}

bootJar {
    mainClass = 'org.vader.core.server.Application'
    archiveFileName = 'vader-core-server.jar'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${SPRING_BOOT_VERSION}"
        mavenBom "org.springframework.ai:spring-ai-bom:${SPRING_AI_VERSION}"
    }
}

jar {
    enabled = false
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-web"

    implementation "org.springframework.ai:spring-ai-starter-mcp-server-webmvc"
    implementation "org.springframework.ai:spring-ai-starter-model-ollama"
    implementation "io.fabric8:kubernetes-client:${FABRIC8_VERSION}"
    implementation "org.apache.commons:commons-lang3"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${SPRINGDOC_VERSION}"

    implementation project(':common:java:model:vader')
    implementation project(':common:java:library:implementation')
    implementation project(':common:java:library:dao')

    runtimeOnly "com.h2database:h2:${H2_VERSION}"
    // Off unless spring.h2.console.enabled is set, which the Helm chart does only in DEV mode.
    runtimeOnly "org.springframework.boot:spring-boot-h2console"
    implementation "io.minio:minio:${MINIO_VERSION}"
    constraints {
        implementation("org.bouncycastle:bcprov-jdk18on:${BOUNCYCASTLE_VERSION}") {
            because "MinIO's own BouncyCastle has known CVEs"
        }
    }

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testImplementation "org.instancio:instancio-core:${INSTANCIO_VERSION}"
    testImplementation "io.fabric8:kubernetes-server-mock:${FABRIC8_VERSION}"
}

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = false
        xml.destination file("./build/reports/jacoco.xml")
        html.destination file("./build/reports/jacocoHtml")
    }
}

test {
    useJUnitPlatform()
}

build.dependsOn jacocoTestReport
