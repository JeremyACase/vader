# Applied to every test in this module. The Kubernetes operators default to enabled in
# vader.operators.enabled/vader.operators.agent-harness.enabled (see KubernetesClientConfig,
# AgentHarnessOperator), since a normal deployment expects a reachable cluster. Test runs --
# including CI's `./gradlew build`, which has none -- override that back off here; the real,
# cluster-backed exercise of the operators happens in the Helm system tests instead.
vader.operators.enabled=false
