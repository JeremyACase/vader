[package]
name = "vader-core-agent-harness"
version = "0.3.0"
edition = "2021"
# Native `async fn` in traits (no `async-trait` crate) has been stable since 1.75.
rust-version = "1.75"
publish = false

[[bin]]
name = "core-agent-harness"
path = "src/main.rs"

[dependencies]
# current-thread runtime only: this harness makes a few sequential HTTP calls, never fans out,
# so a work-stealing multi-thread scheduler would only cost extra OS threads/RSS for nothing.
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No "v4" feature: the harness only ever parses ids core-server hands it, never generates one.
uuid = { version = "1", features = ["serde"] }
thiserror = "2"
# `log` is the facade (this harness's SLF4J equivalent); `env_logger` is a minimal backend that
# writes to stderr (so it shows up in `kubectl logs` with no extra plumbing) and reads its level
# from `RUST_LOG`, same as core-server reads `logging.level.org.vader` -- both configurable per
# deployment, neither hardcoded. Deliberately not `tracing`: this harness makes a few sequential
# HTTP calls with no fan-out, so span-based structured tracing buys nothing here but extra
# dependencies and binary size, which this crate's release profile is explicitly tuned against.
log = "0.4"
env_logger = "0.11"

# Small, fast-starting binary: this runs as a short-lived k8s Job, potentially many at once.
[profile.release]
opt-level = "z"
lto = true
strip = true
