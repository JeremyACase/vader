server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Browser hardening for the app itself. Everything the app loads is same-origin; Angular
  # injects component styles at runtime, hence style-src 'unsafe-inline' (its build must not
  # inline critical CSS, whose loader is an inline event handler this policy blocks). Proxied
  # /vader/ responses keep core-server's own headers instead.
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri $uri/ /index.html;
  }

  # Health
  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

  # Proxy API to core-server (in-cluster)
  location /vader/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 300s;

    proxy_pass http://vader-core-server:8080/vader/;
  }
}
