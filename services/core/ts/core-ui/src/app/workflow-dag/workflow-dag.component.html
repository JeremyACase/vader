<div class="dag-wrapper">
  <div class="dag-toolbar">
    <button type="button" (click)="zoomOut()" [disabled]="!tasks().length" aria-label="Zoom out">−</button>
    <button
      type="button"
      class="dag-zoom-level"
      (click)="resetView()"
      [disabled]="!tasks().length"
      aria-label="Reset zoom and pan">
      {{zoomPercent()}}%
    </button>
    <button type="button" (click)="zoomIn()" [disabled]="!tasks().length" aria-label="Zoom in">+</button>
  </div>

  <div
    #dagCanvas
    class="dag-canvas"
    [class.panning]="panning()"
    (pointerdown)="onPanPointerDown($event)"
    (pointermove)="onPanPointerMove($event)"
    (pointerup)="onPanPointerUp($event)"
    (pointerleave)="onPanPointerCancel()"
    (pointercancel)="onPanPointerCancel()">
    @if (!tasks().length) {
      <p class="muted">Decomposing — the task graph isn't ready yet.</p>
    } @else {
      <svg
        class="dag-svg"
        role="img"
        aria-label="Workflow task graph">
        <defs>
          <marker
            id="dag-arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" class="dag-arrow-head" />
          </marker>
        </defs>

        <g [attr.transform]="transform()">
          @for (edge of layout().edges; track edge.fromTaskId + '->' + edge.toTaskId) {
            <line
              [attr.x1]="edgeStart(edge.fromTaskId).x"
              [attr.y1]="edgeStart(edge.fromTaskId).y"
              [attr.x2]="edgeEnd(edge.toTaskId).x"
              [attr.y2]="edgeEnd(edge.toTaskId).y"
              class="dag-edge"
              marker-end="url(#dag-arrow)" />
          }

          @for (node of layout().nodes; track node.taskId) {
            <g
              class="dag-node"
              [attr.data-task-id]="node.taskId"
              [attr.data-status]="statusOf(node.taskId)"
              [class.selected]="isSelected(node.taskId)"
              [attr.transform]="'translate(' + nodeOrigin(node).x + ',' + nodeOrigin(node).y + ')'">
              <rect [attr.width]="nodeWidth" [attr.height]="nodeHeight" rx="10" class="dag-node-rect" />
              <foreignObject [attr.width]="nodeWidth" [attr.height]="nodeHeight" class="dag-node-fo">
                <div xmlns="http://www.w3.org/1999/xhtml" class="dag-node-label">{{node.title}}</div>
              </foreignObject>
            </g>
          }
        </g>
      </svg>
    }
  </div>
</div>
