<div class="transcript">
  @if (!transcripts().length) {
    <p class="muted">No transcript recorded yet.</p>
  }
  <ol class="turns">
    @for (turn of transcripts(); track turn.id) {
      <li class="turn">
        <p class="turn-index">Turn {{turn.turnIndex}}</p>
        <pre class="turn-prompt">{{turn.prompt}}</pre>
        <pre class="turn-response">{{turn.response}}</pre>
      </li>
    }
  </ol>
</div>
