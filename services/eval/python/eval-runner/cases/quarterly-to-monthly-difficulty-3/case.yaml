# Difficulty level 3 of the quarterly-to-monthly ladder: difficulty level 1's flow column joined by
# a stock column, each with its method stated, so what is being measured is whether the system
# treats the two kinds of column differently -- splitting a total, but interpolating a point-in-time
# count rather than dividing it by three. Values are chosen so neither column needs rounding.
id: quarterly-to-monthly-difficulty-3
difficulty: 3
prompt: |
  Attached is quarterly_metrics.csv. Its revenue column holds each quarter's total revenue; its
  headcount column holds the number of employees on the last day of each quarter. Convert it to
  monthly figures. Split each quarter's revenue evenly across its three months. For headcount,
  each quarter's last month takes that quarter's headcount, and the two months before it are
  interpolated linearly from the previous quarter's headcount; the first quarter has no previous
  quarter, so all three of its months take its own headcount. Deliver the result as
  monthly_metrics.csv with exactly three columns: month (formatted YYYY-MM), revenue and
  headcount, one row per month in chronological order.
inputs:
  - quarterly_metrics.csv
deliverable: monthly_metrics.csv
samples: 5
